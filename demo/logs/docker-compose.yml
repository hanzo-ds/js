# Self-contained Datastore for the RowBinary logs demo.
#
# Brings up a single Datastore node exposing HTTP on localhost:8123 with the
# default user and no password — exactly what the app and seeder default to
# (see lib/datastore.ts / scripts/seed.mjs). No external config files needed:
# DATASTORE_SKIP_USER_SETUP lets the default user connect without a password.
#
#   docker compose up -d     # start
#   npm run seed             # create demo_logs and insert rows
#   npm run dev              # http://localhost:3000
#   docker compose down      # stop (add -v to also wipe the data volume)
services:
  datastore:
    image: "ghcr.io/hanzoai/datastore:${DATASTORE_VERSION-26.6.1.1}"
    container_name: "rowbinary-logs-demo-datastore"
    environment:
      DATASTORE_SKIP_USER_SETUP: 1
    ports:
      - "8123:8123" # HTTP interface (used by the demo)
      - "9000:9000" # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - "datastore-data:/var/lib/hanzo-datastore"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  datastore-data:
