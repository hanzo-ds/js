#version: '3.8'
# This compose file contains both the single-node setup (services `datastore` and `datastore_tls`)
# and the two-node cluster setup (services `datastore1`, `datastore2`, and the `nginx` cluster
# entrypoint). They use non-overlapping host ports so they can be started together with a single
# `docker compose up -d` (or `docker-compose up -d`) and used to run all tests against a single
# environment.
#
# Default single-node ports (kept unchanged):
#   datastore:      8123 (HTTP), 9000 (native)
#   datastore_tls:  8443 (HTTPS), 9440 (native TLS)
#
# Cluster ports (chosen to not conflict with the single-node setup):
#   datastore1:     8124 (HTTP), 9100 (native), 9181 (keeper)
#   datastore2:     8125 (HTTP), 9101 (native), 9182 (keeper)
#   nginx (cluster HTTP entrypoint, round-robin load balancer): 8127
services:
  datastore:
    image: "ghcr.io/hanzoai/datastore:${DATASTORE_VERSION-26.6.1.1}"
    container_name: "datastore-js-datastore-server"
    environment:
      DATASTORE_SKIP_USER_SETUP: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - "./.docker/datastore/single_node/config.xml:/etc/hanzo-datastore-server/config.xml"
      - "./.docker/datastore/users.xml:/etc/hanzo-datastore-server/users.xml"

  datastore_tls:
    build:
      context: ./
      dockerfile: .docker/datastore/single_node_tls/Dockerfile
    container_name: "datastore-js-datastore-server-tls"
    environment:
      DATASTORE_SKIP_USER_SETUP: 1
    ports:
      - "8443:8443"
      - "9440:9440"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - "./.docker/datastore/single_node_tls/config.xml:/etc/hanzo-datastore-server/config.xml"
      - "./.docker/datastore/single_node_tls/users.xml:/etc/hanzo-datastore-server/users.xml"

  datastore1:
    image: "ghcr.io/hanzoai/datastore:${DATASTORE_VERSION-26.6.1.1}"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    hostname: datastore1
    container_name: datastore-js-datastore-server-node-1
    environment:
      DATASTORE_SKIP_USER_SETUP: 1
    ports:
      - "8124:8123"
      - "9100:9000"
      - "9181:9181"
    volumes:
      - "./.docker/datastore/cluster/server1_config.xml:/etc/hanzo-datastore-server/config.xml"
      - "./.docker/datastore/cluster/server1_macros.xml:/etc/hanzo-datastore-server/config.d/macros.xml"
      - "./.docker/datastore/users.xml:/etc/hanzo-datastore-server/users.xml"

  datastore2:
    image: "ghcr.io/hanzoai/datastore:${DATASTORE_VERSION-26.6.1.1}"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    hostname: datastore2
    container_name: datastore-js-datastore-server-node-2
    environment:
      DATASTORE_SKIP_USER_SETUP: 1
    ports:
      - "8125:8123"
      - "9101:9000"
      - "9182:9181"
    volumes:
      - "./.docker/datastore/cluster/server2_config.xml:/etc/hanzo-datastore-server/config.xml"
      - "./.docker/datastore/cluster/server2_macros.xml:/etc/hanzo-datastore-server/config.d/macros.xml"
      - "./.docker/datastore/users.xml:/etc/hanzo-datastore-server/users.xml"

  # Using Nginx as a cluster entrypoint and a round-robin load balancer for HTTP requests
  nginx:
    image: "nginx:1.23.1-alpine"
    hostname: nginx
    ports:
      - "8127:8123"
    volumes:
      - "./.docker/nginx/local.conf:/etc/nginx/conf.d/local.conf"
    container_name: datastore-js-nginx
